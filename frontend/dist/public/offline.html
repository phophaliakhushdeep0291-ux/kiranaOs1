<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KiranaOS offline</title>
    <style>
      body { margin: 0; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .card { max-width: 520px; border: 1px solid #dbe4ea; background: white; border-radius: 8px; padding: 28px; box-shadow: 0 20px 50px rgba(15, 23, 42, .08); }
      h1 { margin: 0; font-size: 28px; line-height: 1.1; }
      p { color: #475569; line-height: 1.6; }
      a, button { display: inline-flex; min-height: 44px; align-items: center; border-radius: 8px; border: 0; background: #0f766e; color: white; padding: 0 16px; font-weight: 700; text-decoration: none; cursor: pointer; }
      .hint { margin-top: 14px; font-size: 13px; color: #64748b; }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Internet offline, billing still works.</h1>
        <p>KiranaOS keeps shop data in IndexedDB on this device. Open the app again from the same device to continue billing, udhar and recovery tools.</p>
        <button onclick="location.reload()">Try again</button>
        <div class="hint">Do not clear browser data. Pending cloud backup will retry when internet returns.</div>
      </section>
    </main>
  </body>
</html>
