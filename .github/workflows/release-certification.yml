name: KiranaOS Release Certification

on:
  # Certify every pull request into main, and main itself after each merge.
  #
  # The pull_request run is a REQUIRED check on main. It was once dropped because
  # it bought no gate: pull requests merged within minutes of the branch push,
  # while this job takes tens of minutes, so the PR run was still going when the
  # merge landed. Then PRs #318 and #320 merged before their certification
  # finished, and the only test gate this repo has was running after the fact.
  # Required, the PR cannot merge until the run passes, so the second billing
  # now buys what it did not before.
  #
  # No paths filter here, deliberately: a required check that never reports
  # leaves the pull request waiting forever, so a docs-only PR must still run it.
  pull_request:
    branches: [main, master]
  # Main's own run records the evidence artifact for the exact commit released.
  push:
    branches: [main, master]
    # Actions minutes are billed on this private repo, and a documentation-only
    # merge cannot change what the certification proves. Anything touching code,
    # schema, lockfiles or this workflow still certifies.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    # One full certification a week, image proof included. Merges to main carry
    # everything else; see RELEASE_CERT_SKIP_IMAGE below.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Main: one run per commit, never cancelled. This job produces the
  # certification evidence for one exact commit, so a merge landing behind it
  # must not kill it — that is what turned main red with nothing actually
  # broken. Keying by SHA rather than ref also stops a third merge from
  # displacing the second while it is still queued, since a group holds only
  # one pending run.
  #
  # Pull requests: one run per PR, and a new push cancels the old one. Each push
  # to a PR is a new merge SHA, so keyed by SHA every superseded run would burn
  # its full twenty minutes for a result nobody can use.
  group: kiranaos-release-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  certify:
    name: PostgreSQL, Redis, frontend, backend, and image proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kiranaos
          POSTGRES_PASSWORD: kiranaos
          POSTGRES_DB: kiranaos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kiranaos -d kiranaos_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://kiranaos:kiranaos@127.0.0.1:5432/kiranaos_ci?schema=public
      DIRECT_DATABASE_URL: postgresql://kiranaos:kiranaos@127.0.0.1:5432/kiranaos_ci?schema=public
      TEST_DATABASE_URL: postgresql://kiranaos:kiranaos@127.0.0.1:5432/kiranaos_ci?schema=public
      POSTGRES_TEST_DATABASE_URL: postgresql://kiranaos:kiranaos@127.0.0.1:5432/kiranaos_ci?schema=public
      ALLOW_POSTGRES_TEST_DB: "true"
      RESTORE_TEST_DATABASE_URL: postgresql://kiranaos:kiranaos@127.0.0.1:5432/kiranaos_restore_ci?schema=public
      ALLOW_RESTORE_TEST_DB: "true"
      FORCE_DB_TESTS: "true"
      JWT_SECRET: ci-jwt-secret-change-me-at-least-32-characters
      LICENSE_SIGNING_SECRET: ci-license-signing-secret-change-me-at-least-32-characters
      ENABLE_DEVICE_LICENSE_SIGNING: "true"
      REDIS_URL: redis://127.0.0.1:6379
      QUEUES_ENABLED: "true"
      RAZORPAY_ENABLED: "false"
      STORAGE_PROVIDER: local
      LOG_LEVEL: silent
      # The image build is the most expensive step in the run, and on a private
      # repo every pull request and every merge to main would pay for it again.
      # Both defer it; the weekly and manual runs carry it. Deferral is recorded
      # as a skip in the evidence report, never as a silent pass, and strict
      # certification still demands it.
      RELEASE_CERT_SKIP_IMAGE: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # setup-node's cache above is keyed to the backend npm lockfile, so the
      # frontend pnpm store is fetched from the registry on every single run.
      # Caching it keeps that download out of the billed minutes.
      - name: Resolve pnpm store path
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # The certification's image proof rebuilt every layer each run — apt
      # install, a second full npm ci, prisma generate — because nothing carried
      # over between jobs. buildx plus a persisted layer cache reuses all of
      # that whenever the Dockerfile, the lockfile and the Prisma schemas are
      # unchanged, which is every commit that only touches source.
      - name: Set up Docker Buildx
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('backend/Dockerfile', 'backend/package-lock.json', 'backend/prisma/schema.prisma', 'backend/prisma-postgres/schema.prisma') }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ runner.os }}-${{ hashFiles('backend/Dockerfile', 'backend/package-lock.json', 'backend/prisma/schema.prisma', 'backend/prisma-postgres/schema.prisma') }}-
            buildx-${{ runner.os }}-

      - name: Reject tracked generated and runtime artifacts
        run: node scripts/check-repository-hygiene.mjs

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated restore target
        env:
          PGPASSWORD: kiranaos
        run: createdb -h 127.0.0.1 -p 5432 -U kiranaos kiranaos_restore_ci

      - name: Run CI release certification
        working-directory: backend
        env:
          # Consumed by scripts/docker-build.js. Unset, the image proof runs the
          # same uncached `docker build .` it always did.
          DOCKER_BUILD_CACHE_DIR: /tmp/.buildx-cache
        run: npm run release:certify:ci

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-certification-${{ github.run_id }}
          path: backend/release-artifacts
          if-no-files-found: error
          # Artifact storage is billed alongside the minutes. A week is long
          # enough to read the evidence for a merge; the report itself is small
          # and the bulk is per-step logs.
          retention-days: 7
