name: Hardware Bridge Windows checks

on:
  pull_request:
    paths:
      - "hardware-bridge/**"
      - ".github/workflows/hardware-bridge-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-bridge-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Bridge tests and Windows setup build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run bridge tests on Windows
        working-directory: hardware-bridge
        run: npm test
      # Compile the same self-contained setup used by the signed installer.
      # This check needs no signing credentials and does not publish a release.
      - name: Build Windows setup application
        working-directory: hardware-bridge
        run: dotnet publish windows/setup-app/KiranaOS.HardwareBridge.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o windows/stage/setup
