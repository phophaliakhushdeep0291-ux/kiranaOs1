name: Hardware Bridge signed installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 1.1.0

permissions:
  contents: read

jobs:
  build-signed-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Run bridge tests
        working-directory: hardware-bridge
        run: npm test
      - name: Restore signing certificate
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.KIRANA_CODE_SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64) { throw "KIRANA_CODE_SIGN_PFX_BASE64 is required" }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\kiranaos-signing.pfx", [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
      - name: Build and verify signed installer
        shell: powershell
        working-directory: hardware-bridge
        env:
          KIRANA_CODE_SIGN_PFX: ${{ runner.temp }}\kiranaos-signing.pfx
          KIRANA_CODE_SIGN_PASSWORD: ${{ secrets.KIRANA_CODE_SIGN_PASSWORD }}
          KIRANA_FRONTEND_ORIGINS: ${{ vars.KIRANA_FRONTEND_ORIGINS }}
        run: .\windows\build-installer.ps1 -Version "${{ inputs.version }}"
      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: KiranaOS-Hardware-Bridge-${{ inputs.version }}-x64
          path: hardware-bridge/dist/KiranaOS-Hardware-Bridge-${{ inputs.version }}-x64.exe
          if-no-files-found: error
          retention-days: 30
