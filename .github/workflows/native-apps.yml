name: Installable apps
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'frontend/**'
      - '.github/workflows/native-apps.yml'
permissions:
  contents: read
concurrency:
  group: native-apps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Desktop ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Windows, os: windows-latest, args: '--win --x64' }
          - { platform: Linux, os: ubuntu-latest, args: '--linux --x64' }
          - { platform: macOS, os: macos-15, args: '--mac --arm64 --x64' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npm ci
        working-directory: native
      - run: npm audit --omit=dev --audit-level=high
        working-directory: native
      - run: npm test
        working-directory: native
      - run: npm run prepare:desktop
        working-directory: native
      - run: npm run dist -- ${{ matrix.args }}
        working-directory: native
      - uses: actions/upload-artifact@v4
        with:
          name: KiranaOS-${{ matrix.platform }}-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            native/release/*.exe
            native/release/*.AppImage
            native/release/*.dmg
            native/release/*.zip
  android:
    name: Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npm ci
        working-directory: native
      - run: npm run prepare:mobile && npm run sync -- android
        working-directory: native
      - run: bash ./gradlew assembleDebug --no-daemon
        working-directory: native/android
      - uses: actions/upload-artifact@v4
        with:
          name: KiranaOS-Android-test-apk
          path: native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  ios:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npm ci
        working-directory: native
      - run: npm run prepare:mobile && npm run sync -- ios
        working-directory: native
      - name: Build without distribution signing
        working-directory: native
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath release/ios CODE_SIGNING_ALLOWED=NO build -quiet
      - run: ditto -c -k --sequesterRsrc --keepParent native/release/ios/Build/Products/Debug-iphonesimulator/App.app native/release/KiranaOS-iOS-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KiranaOS-iOS-simulator
          path: native/release/KiranaOS-iOS-simulator.zip
          if-no-files-found: error
          retention-days: 14
